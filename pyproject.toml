[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mt5-data-fmt"
version = "0.1.0"
description = "Tidy, UTC-correct pandas DataFrames from MetaTrader 5 rates, ticks and deals. Fixes broker-time pitfalls, decodes flags, resamples, finds gaps, saves Parquet."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Sergio Gómez" }]
keywords = ["metatrader5", "mt5", "pandas", "forex", "market-data", "parquet", "trading"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.24", "pandas>=2.0", "pyarrow>=14"]

[project.urls]
Homepage = "https://github.com/sergiogoqui-cpu/mt5-data-fmt"
Issues = "https://github.com/sergiogoqui-cpu/mt5-data-fmt/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mt5_data_fmt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
